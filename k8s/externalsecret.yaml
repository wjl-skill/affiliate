apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: affiliate-secrets-sync
  namespace: affiliate-prod
  labels:
    app.kubernetes.io/name: affiliate-platform
    app.kubernetes.io/part-of: affiliate-platform
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: affiliate-vault-backend
    kind: ClusterSecretStore
  target:
    name: affiliate-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: affiliate/prod/database
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: affiliate/prod/redis
        property: password
    - secretKey: APP_JWT_SECRET
      remoteRef:
        key: affiliate/prod/security
        property: jwt_secret
