name: Affiliate Platform CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  JAVA_VERSION: '21'
  JAVA_DISTRIBUTION: 'temurin'
  DOCKER_IMAGE_NAME: 'affiliate-platform'

jobs:
  # ===================================================================
  # 阶段 1: 全模块代码编译、单元测试与代码质量验证
  # ===================================================================
  build-and-test:
    name: Build & Verify (19 Modules)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Compile and Test with Maven
        run: |
          mvn clean verify -B --errors -Dstyle.color=always

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-test-reports
          path: |
            **/target/surefire-reports/*.txt
            **/target/surefire-reports/*.xml
          retention-days: 7

  # ===================================================================
  # 阶段 2: Kubernetes 清单合规性与 Kustomize 静态语法校验
  # ===================================================================
  k8s-lint-and-validate:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Test Kustomize Build
        run: |
          kustomize build k8s/ > k8s-compiled.yaml
          echo "Kustomize build succeeded. Generated $(wc -l < k8s-compiled.yaml) lines of manifests."

  # ===================================================================
  # 阶段 3: Docker 生产多阶段镜像构建与分层缓存
  # ===================================================================
  docker-build:
    name: Build & Tag Container Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
