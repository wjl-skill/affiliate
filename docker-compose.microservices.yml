version: '3.8'

services:
  # =================================================================
  # 1. Nacos 2.4.3 微服务注册中心与动态配置中心
  # =================================================================
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: affiliate-nacos
    restart: unless-stopped
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - affiliate-network

  # =================================================================
  # 2. 关系数据库服务 (PostgreSQL 16)
  # =================================================================
  postgres:
    image: postgres:16-alpine
    container_name: affiliate-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affiliate-network

  # =================================================================
  # 3. 分布式缓存与原子预占服务 (Redis 7)
  # =================================================================
  redis:
    image: redis:7-alpine
    container_name: affiliate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis123}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affiliate-network

  # =================================================================
  # 4. 分布式可靠消息流 (Apache Kafka - KRaft Mode)
  # =================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: affiliate-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - affiliate-network

  # =================================================================
  # 5. 微服务 1: Tracker 转化追踪边缘数据面 (Port 8081)
  # =================================================================
  platform-app-tracker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: platform-app-tracker
        APP_PORT: 8081
    container_name: platform-app-tracker
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: prod
      NACOS_GROUP: AFFILIATE_GROUP
      DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=public&reWriteBatchedInserts=true&stringtype=unspecified
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JWT_SECRET: ${APP_JWT_SECRET:-affiliate-platform-production-jwt-token-secret-must-be-long-enough-32bytes}
    networks:
      - affiliate-network

  # =================================================================
  # 6. 微服务 2: RTB 毫秒级实时竞价数据面 (Port 8082)
  # =================================================================
  platform-app-rtb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: platform-app-rtb
        APP_PORT: 8082
    container_name: platform-app-rtb
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: prod
      NACOS_GROUP: AFFILIATE_GROUP
      DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=public&reWriteBatchedInserts=true&stringtype=unspecified
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-affiliate-platform-production-jwt-token-secret-must-be-long-enough-32bytes}
      RTB_HMAC_SECRET: ${RTB_HMAC_SECRET:-affiliate-default-secret-key-32b!}
    networks:
      - affiliate-network

  # =================================================================
  # 7. 微服务 3: Admin 运营控制面与多维报表服务 (Port 8083)
  # =================================================================
  platform-app-admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: platform-app-admin
        APP_PORT: 8083
    container_name: platform-app-admin
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: prod
      NACOS_GROUP: AFFILIATE_GROUP
      FLYWAY_ENABLED: "true"
      DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=public&reWriteBatchedInserts=true&stringtype=unspecified
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JWT_SECRET: ${APP_JWT_SECRET:-affiliate-platform-production-jwt-token-secret-must-be-long-enough-32bytes}
    networks:
      - affiliate-network

  # =================================================================
  # 8. 微服务 4: Worker 异步任务、Outbox 中继与高并发补量服务 (Port 8084)
  # =================================================================
  platform-app-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: platform-app-worker
        APP_PORT: 8084
    container_name: platform-app-worker
    restart: unless-stopped
    ports:
      - "8084:8084"
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      NACOS_ENABLED: "true"
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: prod
      NACOS_GROUP: AFFILIATE_GROUP
      DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=public&reWriteBatchedInserts=true&stringtype=unspecified
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_JWT_SECRET: ${APP_JWT_SECRET:-affiliate-platform-production-jwt-token-secret-must-be-long-enough-32bytes}
    networks:
      - affiliate-network

networks:
  affiliate-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
