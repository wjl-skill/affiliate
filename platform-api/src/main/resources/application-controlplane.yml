# ===================================================================
# Affiliate Platform 管理控制面配置 (Profile: controlplane)
# 专为 Console 管理控制台、财务结算出账、运营审核与报表聚合设计
# ===================================================================

spring:
  config:
    activate:
      on-profile: controlplane

  threads:
    virtual:
      enabled: true

  # 控制面分配标准数据库连接池
  datasource:
    hikari:
      pool-name: AffiliateControlPlaneHikari
      maximum-pool-size: ${DB_CONTROLPLANE_MAX_POOL_SIZE:50}
      minimum-idle: 10
      connection-timeout: 3000

  flyway:
    enabled: ${FLYWAY_ENABLED:true}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: affiliate-controlplane-group
      auto-offset-reset: earliest
      enable-auto-commit: false

app:
  security:
    enabled: true
  infrastructure:
    database-enabled: true
    redis-enabled: true
    kafka-enabled: true
