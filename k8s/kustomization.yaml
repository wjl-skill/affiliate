apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: affiliate-prod

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment-dataplane.yaml
  - deployment-controlplane.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml
  - migration-job.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: affiliate-platform

images:
  - name: affiliate-dataplane
    newName: ghcr.io/affiliate/dataplane
    newTag: 0.2.0
  - name: affiliate-controlplane
    newName: ghcr.io/affiliate/controlplane
    newTag: 0.2.0
