apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: affiliate-ingress
  namespace: affiliate-prod
  labels:
    app.kubernetes.io/name: affiliate-ingress
    app.kubernetes.io/part-of: affiliate-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "15"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
spec:
  tls:
    - hosts:
        - "api.affiliate-network.com"
        - "track.affiliate-network.com"
      secretName: affiliate-tls-cert
  rules:
    # 极速热路径专用域名 (点击跳转、S2S 回传、RTB 竞价) -> 数据面服务
    - host: "track.affiliate-network.com"
      http:
        paths:
          - path: /affiliate/click
            pathType: Prefix
            backend:
              service:
                name: affiliate-dataplane-svc
                port:
                  number: 8080
          - path: /affiliate/postback
            pathType: Prefix
            backend:
              service:
                name: affiliate-dataplane-svc
                port:
                  number: 8080
          - path: /rtb
            pathType: Prefix
            backend:
              service:
                name: affiliate-dataplane-svc
                port:
                  number: 8080
    # 管理面与报表对账专用域名 (后台管理、对账 API、报表查询) -> 控制面服务
    - host: "api.affiliate-network.com"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: affiliate-controlplane-svc
                port:
                  number: 8080
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: affiliate-controlplane-svc
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: affiliate-controlplane-svc
                port:
                  number: 8080
