# ===================================================================
# Affiliate Platform Tracker 生产环境配置 (Profile: prod)
# ===================================================================

spring:
  config:
    activate:
      on-profile: prod
  autoconfigure:
    exclude: []

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/postgres?currentSchema=public&reWriteBatchedInserts=true&stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_DATAPLANE_MAX_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 1000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 5000
      connection-test-query: SELECT 1

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: ${REDIS_TIMEOUT:1000ms}
      client-type: lettuce
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:150}
          max-idle: 30
          min-idle: 10
          max-wait: ${REDIS_POOL_MAX_WAIT:1000ms}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: 1
      retries: 3
      batch-size: 16384
      linger-ms: 5

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.affiliate.platform.entity
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    jdbc-type-for-null: 'null'

app:
  tenant:
    strict-mode: ${TENANT_STRICT_MODE:true}
  security:
    enabled: true
    jwt-secret: ${APP_JWT_SECRET}
    postback-auth-required: ${POSTBACK_AUTH_REQUIRED:true}
    postback-secret: ${POSTBACK_HMAC_SECRET:}
  infrastructure:
    database-enabled: true
    redis-enabled: true
    kafka-enabled: true
