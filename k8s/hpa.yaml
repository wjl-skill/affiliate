apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: affiliate-dataplane-hpa
  namespace: affiliate-prod
  labels:
    app.kubernetes.io/name: affiliate-dataplane
    app.kubernetes.io/component: dataplane
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: affiliate-dataplane
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 4
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300 # 5分钟缩容缓冲期，平抑流量抖动
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
      selectPolicy: Min
