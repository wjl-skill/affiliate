# ===================================================================
# Affiliate Platform 全局应用配置 (默认激活 pg 本地环境)
# ===================================================================

spring:
  application:
    # 应用程序名称
    name: affiliate-platform
  profiles:
    # 默认激活本地 PostgreSQL + MyBatis-Plus 环境 (Profile: pg)
    active: ${SPRING_PROFILES_ACTIVE:pg}

  # Java 21 Project Loom 虚拟线程全量调度支持 (Sub-millisecond Concurrency)
  threads:
    virtual:
      enabled: true

  # 默认数据源配置 (PostgreSQL 本地环境)
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/postgres?currentSchema=public&reWriteBatchedInserts=true&stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:199010}
    hikari:
      pool-name: AffiliateHikariCP
      maximum-pool-size: ${DB_MAX_POOL_SIZE:50}
      minimum-idle: ${DB_MIN_IDLE:10}
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 5000
      connection-test-query: SELECT 1

  # 全局 Redis 缓存与分布式原子预占/频控配置
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123456}
      database: ${REDIS_DB:0}
      timeout: ${REDIS_TIMEOUT:3000ms}
      client-type: lettuce
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:50}
          max-idle: ${REDIS_POOL_MAX_IDLE:10}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:3000ms}

  autoconfigure:
    # 默认本地模式排除非必要的中间件自动装配
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# ===================================================================
# MyBatis-Plus 增强持久层配置
# ===================================================================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.affiliate.platform.entity
  global-config:
    banner: false
    db-config:
      id-type: assign_id
      table-underline: true
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    jdbc-type-for-null: 'null'

server:
  # HTTP 监听端口
  port: 8080
  compression:
    # 启用 GZIP 压缩以降低响应传输体积
    enabled: true
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        # 暴露 Actuator 监控端点（健康检查、指标度量、Prometheus）
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        # 启用 Kubernetes 探针 (Liveness/Readiness)
        enabled: true

app:
  security:
    # 是否强制启用基于 JWT Resource Server 的安全鉴权（本地默认关闭，生产开启）
    enabled: false
  infrastructure:
    # 启用真实关系型数据库 (PostgreSQL) 持久化
    database-enabled: true
    # 启用 Redis 缓存与分布式原子预占
    redis-enabled: true
    # 本地关闭 Apache Kafka 消息总线（使用内存发件箱与同步发布器）
    kafka-enabled: false
  google:
    # 是否启用 Google Ads / GAM 外部生态连接器
    enabled: false
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/google/oauth/callback}
    scopes: ${GOOGLE_SCOPES:https://www.googleapis.com/auth/adwords,https://www.googleapis.com/auth/dfp}
  rtb:
    # HMAC-SHA256 追踪 Token 签名密钥
    hmac-secret: ${RTB_HMAC_SECRET:affiliate-default-secret-key-32b!}
  auction:
    # 默认竞价超时时限（毫秒）
    default-timeout-ms: 20
    # 默认广告位保底价格（USD）
    default-floor-price: 0.10
