# ===================================================================
# Affiliate Platform Admin PostgreSQL 本地开发环境配置 (Profile: pg)
# 针对本地 PostgreSQL: 127.0.0.1:5432 / postgres (用户: postgres / 密码: 199010)
# ===================================================================

spring:
  config:
    activate:
      on-profile: pg
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/postgres?currentSchema=public&reWriteBatchedInserts=true&stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:199010}

  data:
    redis:
      password: ${REDIS_PASSWORD:123456}

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
