version: '3.8'

services:
  # =================================================================
  # 1. 基础中间件服务
  # =================================================================
  postgres:
    image: postgres:16-alpine
    container_name: affiliate-split-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    volumes:
      - postgres_data_split:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affiliate-split-network

  redis:
    image: redis:7-alpine
    container_name: affiliate-split-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis123}", "--appendonly", "yes"]
    volumes:
      - redis_data_split:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - affiliate-split-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: affiliate-split-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data_split:/var/lib/kafka/data
    networks:
      - affiliate-split-network

  # =================================================================
  # 2. 物理拆分微服务集群
  # =================================================================
  affiliate-admin:
    build:
      context: .
      dockerfile: Dockerfile.apps
      args:
        APP_MODULE: platform-app-admin
        APP_PORT: 8083
    container_name: affiliate-admin
    restart: unless-stopped
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=public&reWriteBatchedInserts=true&stringtype=unspecified
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
    networks:
      - affiliate-split-network

  affiliate-tracker:
    build:
      context: .
      dockerfile: Dockerfile.apps
      args:
        APP_MODULE: platform-app-tracker
        APP_PORT: 8081
    container_name: affiliate-tracker
    restart: unless-stopped
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=public&reWriteBatchedInserts=true&stringtype=unspecified
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLYWAY_ENABLED: "false"
    networks:
      - affiliate-split-network

  affiliate-rtb:
    build:
      context: .
      dockerfile: Dockerfile.apps
      args:
        APP_MODULE: platform-app-rtb
        APP_PORT: 8082
    container_name: affiliate-rtb
    restart: unless-stopped
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=public&reWriteBatchedInserts=true&stringtype=unspecified
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      FLYWAY_ENABLED: "false"
    networks:
      - affiliate-split-network

  affiliate-worker:
    build:
      context: .
      dockerfile: Dockerfile.apps
      args:
        APP_MODULE: platform-app-worker
        APP_PORT: 8084
    container_name: affiliate-worker
    restart: unless-stopped
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/postgres?currentSchema=public&reWriteBatchedInserts=true&stringtype=unspecified
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLYWAY_ENABLED: "false"
    networks:
      - affiliate-split-network

networks:
  affiliate-split-network:
    driver: bridge

volumes:
  postgres_data_split:
    driver: local
  redis_data_split:
    driver: local
  kafka_data_split:
    driver: local
